name: Build Mangaku APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versi APK"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_FILE: mangaku-release.keystore
      KEY_ALIAS: mangaku
      KEYSTORE_PASSWORD: mangaku123456
      KEY_PASSWORD: mangaku123456

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Hapus keystore lama yang password-nya tidak cocok
      - name: Remove old keystore
        run: |
          rm -f "$KEYSTORE_FILE"
          rm -f "app/release.keystore"
          rm -f "mangaku-app/release.keystore"

      # Buat keystore baru
      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Mangaku, OU=Mangaku, O=Mangaku, L=Indonesia, ST=Indonesia, C=ID"

          echo "Keystore berhasil dibuat."

      # Buat file signing.properties
      - name: Create signing properties
        run: |
          cat > signing.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/$KEYSTORE_FILE
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Check project
        run: |
          echo "Project:"
          find . -maxdepth 3 -type f | sort

      - name: Prepare Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Locate APK
        id: apk
        run: |
          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan."
            exit 1
          fi

          echo "APK: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          mkdir -p release

          cp "${{ steps.apk.outputs.apk }}" \
          "release/Mangaku-${{ github.event.inputs.version }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mangaku-APK-${{ github.event.inputs.version }}
          path: release/Mangaku-${{ github.event.inputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version }}"
          name: "Mangaku APK v${{ github.event.inputs.version }}"
          body: |
            # Mangaku APK

            Versi: ${{ github.event.inputs.version }}

            APK berhasil dibuat melalui GitHub Actions.
          files: |
            release/Mangaku-${{ github.event.inputs.version }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
