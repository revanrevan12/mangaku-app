plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mangareader.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.mangareader.app"
        minSdk 21
        targetSdk 34
        versionCode 126
        versionName "1.2.9"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            // Keep minify off by default — R8 needs keep rules that break simple WebView shells.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // CI signs with apksigner after assembleRelease (unsigned output is expected).
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
