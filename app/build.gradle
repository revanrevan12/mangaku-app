apply plugin: 'com.android.application'

// Signing config: reads keystore.properties (created by the GitHub Actions
// workflow from the KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets).
// Falls back gracefully when the file is absent (local debug builds).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'id.mangaku.app'
    compileSdk 34

    defaultConfig {
        applicationId "id.mangaku.app"
        minSdk 21
        targetSdk 34
        versionCode 10000
        versionName "1.0.0"
        vectorDrawables.useSupportLibrary true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file('release.keystore')
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.11.0'
}
