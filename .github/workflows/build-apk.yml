name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama aplikasi'
        required: false
        default: 'Manga Reader'
      version_name:
        description: 'Version name (mis. 1.0.0)'
        required: false
        default: '1.2.4'
      version_code:
        description: 'Version code (angka)'
        required: false
        default: '127'
      website_url:
        description: 'URL website yang dibungkus WebView'
        required: false
        default: ''
      release_tag:
        description: 'Tag GitHub Release'
        required: false
        default: 'v1.2.4-manual'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Generate Android project
        run: node .github/scripts/gen-android.js
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          WEBSITE_URL: ${{ github.event.inputs.website_url }}
          FALLBACK_PACKAGE: 'com.mangareader.app'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate and sign APK
        id: sign
        run: |
          APK=$(find . -path '*/outputs/apk/release/*.apk' | head -1)
          if [ -z "$APK" ]; then echo "APK tidak ditemukan"; exit 1; fi
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
            SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
            "$SIGNER" sign --ks /tmp/release.jks \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              "$APK"
            echo "Signed with release keystore"
          else
            echo "KEYSTORE_BASE64 tidak diset — APK memakai debug signing"
          fi
          SIGNED_APK="manga-app-${{ github.event.inputs.version_name }}.apk"
          cp "$APK" "$SIGNED_APK"
          echo "apk_path=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.app_name }} v${{ github.event.inputs.version_name }}
          files: ${{ steps.sign.outputs.apk_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
