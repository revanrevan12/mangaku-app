name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama aplikasi'
        required: false
        default: 'Manga'
      version_name:
        description: 'Version name (mis. 1.0.0)'
        required: false
        default: '1.2.4'
      version_code:
        description: 'Version code (angka)'
        required: false
        default: '127'
      website_url:
        description: 'URL website yang dibungkus WebView'
        required: false
        default: ''
      logo_url:
        description: 'URL logo website (PNG/JPG) untuk app icon'
        required: false
        default: ''
      release_tag:
        description: 'Tag GitHub Release'
        required: false
        default: 'v1.2.4-manual'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Generate Android project
        run: node .github/scripts/gen-android.js
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          WEBSITE_URL: ${{ github.event.inputs.website_url }}
          LOGO_URL: ${{ github.event.inputs.logo_url }}
          FALLBACK_PACKAGE: 'com.mangareader.app'

      - name: Validate generated project
        run: |
          set -e
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/values/strings.xml
          test -f app/src/main/res/values/colors.xml
          test -f app/src/main/res/values/themes.xml
          test -f app/src/main/res/drawable/ic_launcher.xml || test -f app/src/main/res/drawable-nodpi/ic_launcher.png
          find app/src/main -type f | sort
          echo "Project structure OK"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: .
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          ls -la app/build/outputs/apk/release/

      - name: Locate and sign APK
        id: sign
        run: |
          set -e
          APK=$(find . -path '*/outputs/apk/release/*.apk' ! -name '*.apk.idsig' | head -1)
          if [ -z "$APK" ]; then echo "APK tidak ditemukan"; find . -name '*.apk' 2>/dev/null; exit 1; fi
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
            SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
            "$SIGNER" sign --ks /tmp/release.jks \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              "$APK"
            echo "Signed with release keystore"
          else
            echo "KEYSTORE_BASE64 tidak diset — APK memakai debug signing"
          fi
          SIGNED_APK="manga-app-${{ github.event.inputs.version_name }}.apk"
          cp "$APK" "$SIGNED_APK"
          echo "apk_path=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.app_name }} v${{ github.event.inputs.version_name }}
          files: ${{ steps.sign.outputs.apk_path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
