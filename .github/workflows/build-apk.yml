name: Build APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name'
        required: false
        default: '1.2.9'
  push:
    branches: [ 'main' ]
    paths:
      - 'app.config.json'
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Read app config
        run: |
          set -euo pipefail
          test -f app.config.json || { echo "::error::app.config.json missing"; exit 1; }
          echo "VERSION_NAME=$(jq -r .app.version_name app.config.json)" >> $GITHUB_ENV
          echo "VERSION_CODE=$(jq -r .app.version_code app.config.json)" >> $GITHUB_ENV
          echo "APP_NAME=$(jq -r .app.name app.config.json)" >> $GITHUB_ENV
          echo "PKG=$(jq -r .app.package_id app.config.json)" >> $GITHUB_ENV

      - name: Verify project layout
        run: |
          set -euo pipefail
          for f in settings.gradle build.gradle app/build.gradle app/src/main/AndroidManifest.xml app/src/main/res/drawable/ic_launcher_legacy.xml; do
            test -f "$f" || { echo "::error::missing $f — push the app source from the website admin first"; exit 1; }
          done
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "JAVA_HOME=${JAVA_HOME:-}"
          java -version
          ls "$ANDROID_HOME/build-tools" || true
          find app/src -type f | head -50

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          if ! gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > deps.txt 2>&1; then
            echo "::error::dependency resolution failed"
            tail -80 deps.txt || true
            exit 1
          fi
          echo "::notice::dependencies resolved"
          tail -20 deps.txt

      - name: Build release APK (unsigned)
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease --stacktrace --info 2>&1 | tee build.log
          RAW="$(find app/build/outputs/apk -name '*.apk' 2>/dev/null | head -n 1 || true)"
          if [ -z "$RAW" ]; then
            echo "::error::assembleRelease produced no APK — last 80 log lines:"
            tail -80 build.log || true
            exit 1
          fi
          echo "::notice::unsigned APK: $RAW ($(stat -c%s "$RAW") bytes)"

      - name: List APK outputs (debug)
        if: always()
        run: |
          set -euo pipefail
          echo "::group::APK files produced by gradle"
          find app/build/outputs -type f -name '*.apk' -printf '%p  %s bytes\n' 2>/dev/null || echo "no apk found under app/build/outputs"
          ls -lhR app/build/outputs/apk 2>/dev/null || true
          echo "::endgroup::"

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          STORE_PASS="${KEYSTORE_PASSWORD:-android}"
          ALIAS="${KEY_ALIAS:-appkey}"
          KEY_PASS="${KEY_PASSWORD:-$STORE_PASS}"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "::notice::using KEYSTORE_BASE64 secret ($(stat -c%s release.keystore) bytes)"
          else
            echo "::warning::KEYSTORE_BASE64 not set — generating a build keystore with keytool"
            keytool -genkeypair -v -storetype PKCS12 -keystore release.keystore -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=${APP_NAME:-App}, OU=Mobile, O=${PKG:-app}, C=ID"
          fi
          if ! keytool -list -keystore release.keystore -storepass "$STORE_PASS" > ks.list 2>/dev/null; then
            keytool -list -storetype PKCS12 -keystore release.keystore -storepass "$STORE_PASS" > ks.list \
              || { echo "::error::keystore invalid or wrong KEYSTORE_PASSWORD"; exit 1; }
            echo "STORE_TYPE=PKCS12" >> $GITHUB_ENV
          else
            echo "STORE_TYPE=AUTO" >> $GITHUB_ENV
          fi
          cat ks.list
          if ! grep -qi "$ALIAS" ks.list; then
            keytool -list -keystore release.keystore -storepass "$STORE_PASS" -alias "$ALIAS" > /dev/null 2>&1 \
              || keytool -list -storetype PKCS12 -keystore release.keystore -storepass "$STORE_PASS" -alias "$ALIAS" > /dev/null 2>&1 \
              || { echo "::error::alias '$ALIAS' not found in keystore (check KEY_ALIAS). Contents:"; cat ks.list; exit 1; }
          fi
          echo "STORE_PASS=$STORE_PASS" >> $GITHUB_ENV
          echo "ALIAS=$ALIAS" >> $GITHUB_ENV
          echo "KEY_PASS=$KEY_PASS" >> $GITHUB_ENV

      - name: Zipalign & sign APK
        id: sign
        run: |
          set -euo pipefail
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          TOOLS="$ANDROID_HOME/build-tools/$BT"
          RAW="$(find app/build/outputs/apk -name '*.apk' | head -n 1)"
          test -n "$RAW" || { echo "::error::gradle produced no APK"; exit 1; }
          mkdir -p dist
          SAFE_NAME="${APP_NAME// /-}"
          OUT="dist/${SAFE_NAME}-${VERSION_NAME}-${VERSION_CODE}.apk"
          "$TOOLS/zipalign" -p -f 4 "$RAW" aligned.apk
          if [ "${STORE_TYPE:-AUTO}" = "PKCS12" ]; then
            "$TOOLS/apksigner" sign \
              --ks release.keystore --ks-type PKCS12 \
              --ks-pass "pass:$STORE_PASS" --ks-key-alias "$ALIAS" --key-pass "pass:$KEY_PASS" \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out "$OUT" aligned.apk
          else
            "$TOOLS/apksigner" sign \
              --ks release.keystore \
              --ks-pass "pass:$STORE_PASS" --ks-key-alias "$ALIAS" --key-pass "pass:$KEY_PASS" \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out "$OUT" aligned.apk
          fi
          "$TOOLS/apksigner" verify --verbose --print-certs "$OUT" \
            || { echo "::error::APK signature verification failed"; exit 1; }
          "$TOOLS/zipalign" -c -v 4 "$OUT" > /dev/null \
            || { echo "::error::APK is not zipaligned"; exit 1; }
          echo "apk_path=$OUT" >> $GITHUB_OUTPUT
          echo "::notice::signed APK $OUT ($(stat -c%s "$OUT") bytes)"

      - name: Validate APK contents
        env:
          APK: ${{ steps.sign.outputs.apk_path }}
        run: |
          set -euo pipefail
          BT="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          AAPT2="$ANDROID_HOME/build-tools/$BT/aapt2"
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          [ "$SIZE" -gt 300000 ] || { echo "::error::APK suspiciously small ($SIZE bytes)"; exit 1; }
          unzip -t "$APK" > /dev/null || { echo "::error::not a valid ZIP/APK container"; exit 1; }
          LIST=$(unzip -Z1 "$APK")
          for entry in AndroidManifest.xml classes.dex resources.arsc; do
            echo "$LIST" | grep -qx "$entry" || { echo "::error::missing $entry in APK"; exit 1; }
          done
          echo "$LIST" | grep -Eq '^META-INF/.*\.(RSA|DSA|EC)$' || echo "::warning::no v1 signature block (v2/v3 still valid on Android 7+)"
          echo "$LIST" | grep -q '^res/' || { echo "::error::no res/ resources in APK"; exit 1; }
          "$AAPT2" dump packagename "$APK" || { echo "::error::aapt2 cannot read the manifest"; exit 1; }
          FOUND_PKG="$("$AAPT2" dump packagename "$APK" | tr -d '\r\n')"
          [ "$FOUND_PKG" = "$PKG" ] || { echo "::error::package mismatch: APK=$FOUND_PKG config=$PKG"; exit 1; }
          echo "::notice::APK valid & installable: $APK ($SIZE bytes, $FOUND_PKG)"

      - name: Pack source ZIP
        id: source
        run: |
          set -euo pipefail
          SAFE_NAME="${APP_NAME// /-}"
          SRC="dist/${SAFE_NAME}-${VERSION_NAME}-${VERSION_CODE}-source.zip"
          zip -qr "$SRC" app *.gradle gradle.properties app.config.json .github README.md -x 'app/build/*'
          echo "source_path=$SRC" >> $GITHUB_OUTPUT

      - name: Debug APK tree
        if: always()
        run: |
          set +e
          echo "::group::app/build/outputs tree"
          find app/build/outputs -type f -printf '%p  %s bytes\n' 2>/dev/null || echo "(no outputs yet)"
          ls -lahR app/build/outputs 2>/dev/null || true
          ls -lah dist 2>/dev/null || true
          echo "::endgroup::"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            dist/*.apk
            dist/*-source.zip
            app.config.json
          if-no-files-found: error

      # Primary publish path: softprops (reliable binary asset upload).
      - name: Publish GitHub Release (softprops)
        id: gh_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          name: ${{ env.APP_NAME }} v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          body: |
            Signed release build ${{ env.VERSION_CODE }} for ${{ env.PKG }}
            - APK: zipaligned, v1+v2+v3 signed
            - Commit: ${{ github.sha }}
            - Content served live from the website API — no rebuild needed for new manga.
          files: |
            dist/*.apk
            dist/*-source.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Always verify APK is on the release; upload via gh/curl if missing.
      - name: Ensure APK on Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${VERSION_NAME}-${VERSION_CODE}"
          TITLE="${APP_NAME} v${VERSION_NAME}"

          echo "::group::locate APK"
          find dist app/build/outputs -type f -name '*.apk' -printf '%p  %s bytes\n' 2>/dev/null || true
          APK_PATH="$(ls -1 dist/*.apk 2>/dev/null | head -n 1 || true)"
          if [ -z "${APK_PATH:-}" ]; then
            APK_PATH="$(find app/build/outputs -type f -name '*.apk' 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "${APK_PATH:-}" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::No APK file found under dist/ or app/build/outputs"
            exit 1
          fi
          APK_NAME="$(basename "$APK_PATH")"
          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "APK_PATH=$APK_PATH"
          echo "APK_NAME=$APK_NAME"
          echo "APK_SIZE=$APK_SIZE"
          (xxd -l 4 "$APK_PATH" || head -c 4 "$APK_PATH" | od -An -tx1) || true
          if [ "$APK_SIZE" -lt 300000 ]; then
            echo "::error::APK too small ($APK_SIZE)"
            exit 1
          fi
          unzip -t "$APK_PATH" >/dev/null || { echo "::error::APK is not a valid ZIP"; exit 1; }
          SRC_PATH="$(ls -1 dist/*-source.zip 2>/dev/null | head -n 1 || true)"
          echo "::endgroup::"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::creating release $TAG"
            gh release create "$TAG" --title "$TITLE" --notes "APK release $TAG" --target "$GITHUB_SHA"
          fi

          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          RELEASE_ID="$(printf '%s' "$RELEASE_JSON" | jq -r .id)"
          UPLOAD_URL="$(printf '%s' "$RELEASE_JSON" | jq -r .upload_url | sed 's/{.*//')"
          echo "::notice::release id=$RELEASE_ID tag=$TAG upload_url=$UPLOAD_URL"
          printf '%s' "$RELEASE_JSON" | jq '{id,tag_name,name,assets:[.assets[]?|{name,size,state}]}' || true

          apk_listed() {
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate --jq '.[].name' 2>/dev/null | grep -Fxq "$APK_NAME"
          }

          if apk_listed; then
            SZ=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate --jq ".[] | select(.name==\"$APK_NAME\") | .size" | head -n1)
            echo "::notice::APK already on release: $APK_NAME ($SZ bytes)"
            if [ "${SZ:-0}" -gt 300000 ]; then
              exit 0
            fi
          fi

          ENC_NAME=$(printf '%s' "$APK_NAME" | jq -sRr @uri)

          for attempt in 1 2 3 4; do
            echo "::group::upload attempt $attempt"
            for aid in $(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate --jq ".[] | select(.name==\"$APK_NAME\") | .id" || true); do
              echo "deleting asset id $aid"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${aid}" || true
            done

            UPLOADED=0

            # Method A: gh release upload (explicit single file path)
            if gh release upload "$TAG" "$APK_PATH" --clobber; then
              echo "method A (gh release upload) OK"
              UPLOADED=1
            else
              echo "method A failed"
            fi

            # Method B: curl → release upload_url (APK content-type)
            if [ "$UPLOADED" -eq 0 ]; then
              HTTP=$(curl -sS -o /tmp/up-apk.json -w '%{http_code}'                 -X POST                 -H "Authorization: Bearer ${GH_TOKEN}"                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 -H "Content-Type: application/vnd.android.package-archive"                 --data-binary @"$APK_PATH"                 "${UPLOAD_URL}?name=${ENC_NAME}") || HTTP=000
              echo "method B curl HTTP=$HTTP"
              head -c 500 /tmp/up-apk.json || true; echo
              case "$HTTP" in
                200|201) UPLOADED=1 ;;
              esac
            fi

            # Method C: curl → uploads.github.com (octet-stream)
            if [ "$UPLOADED" -eq 0 ]; then
              HTTP=$(curl -sS -o /tmp/up-apk2.json -w '%{http_code}'                 -X POST                 -H "Authorization: Bearer ${GH_TOKEN}"                 -H "Accept: application/vnd.github+json"                 -H "X-GitHub-Api-Version: 2022-11-28"                 -H "Content-Type: application/octet-stream"                 --data-binary @"$APK_PATH"                 "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ENC_NAME}") || HTTP=000
              echo "method C curl HTTP=$HTTP"
              head -c 500 /tmp/up-apk2.json || true; echo
              case "$HTTP" in
                200|201) UPLOADED=1 ;;
              esac
            fi

            if [ -n "${SRC_PATH:-}" ] && [ -f "$SRC_PATH" ]; then
              gh release upload "$TAG" "$SRC_PATH" --clobber || true
            fi

            echo "assets after attempt $attempt:"
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate --jq '.[] | "\(.name) \(.size)b state=\(.state)"' || true
            echo "::endgroup::"

            if apk_listed; then
              SZ=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate --jq ".[] | select(.name==\"$APK_NAME\") | .size" | head -n1)
              echo "::notice::APK verified on release assets: $APK_NAME ($SZ bytes)"
              if [ "${SZ:-0}" -ge 300000 ]; then
                exit 0
              fi
            fi
            sleep $((attempt * 5))
          done

          echo "::error::APK never appeared on release $TAG assets after 4 attempts"
          echo "Enable: Settings → Actions → General → Workflow permissions → Read and write permissions"
          exit 1

      - name: Build summary
        if: always()
        run: |
          {
            echo "### ${APP_NAME} ${VERSION_NAME} (${VERSION_CODE})"
            echo "- Package: ${PKG}"
            echo "- Dist APKs:"
            ls -lah dist/*.apk 2>/dev/null || echo "(none)"
          } >> $GITHUB_STEP_SUMMARY
