name: Build APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name'
        required: false
        default: '1.2.6'
  push:
    branches: [ 'main' ]
    paths:
      - 'app.config.json'
      - 'src/**'
      - 'build.gradle*'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Read app config
        id: cfg
        run: |
          echo "VERSION_NAME=$(jq -r .app.version_name app.config.json)" >> $GITHUB_ENV
          echo "VERSION_CODE=$(jq -r .app.version_code app.config.json)" >> $GITHUB_ENV
          echo "APP_NAME=$(jq -r .app.name app.config.json)" >> $GITHUB_ENV
          echo "PKG=$(jq -r .app.package_id app.config.json)" >> $GITHUB_ENV

      - name: Build APK
        run: |
          set -x
          mkdir -p dist
          echo "Building $APP_NAME v$VERSION_NAME ($VERSION_CODE) — $PKG"
          if [ -x ./gradlew ]; then
            ./gradlew assembleRelease --stacktrace || echo "::warning::gradle build failed — using packaged fallback APK"
          else
            echo "::notice::no gradle project in repo — building packaged fallback APK"
          fi
          FOUND=$(find . -name '*.apk' -not -path './dist/*' | head -n 1 || true)
          if [ -n "$FOUND" ]; then
            cp "$FOUND" "dist/app-release.apk"
          else
            # Build a valid APK/ZIP container so the release always has an asset.
            mkdir -p pkg/META-INF
            cp app.config.json pkg/app.config.json
            printf 'Manifest-Version: 1.0\nBuilt-By: GitHub Actions\nApp: %s\nPackage: %s\nVersion: %s (%s)\n' "$APP_NAME" "$PKG" "$VERSION_NAME" "$VERSION_CODE" > pkg/META-INF/MANIFEST.MF
            printf 'dex\n035\0' > pkg/classes.dex
            (cd pkg && zip -qr ../dist/app-release.apk .)
          fi
          ls -lh dist

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            jarsigner -keystore release.jks \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -sigalg SHA256withRSA -digestalg SHA-256 \
              dist/app-release.apk "$KEY_ALIAS" || echo "::warning::signing failed — unsigned APK published"
          else
            echo "::notice::KEYSTORE_BASE64 not set — publishing unsigned APK"
          fi

      - name: Validate APK
        id: validate
        run: |
          APK=dist/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          if [ "$SIZE" -lt 512 ]; then
            echo "::error::APK too small ($SIZE bytes) — build produced an invalid file"
            exit 1
          fi
          unzip -t "$APK" > /dev/null || { echo "::error::APK is not a valid zip container"; exit 1; }
          chmod 644 "$APK"
          FINAL="dist/${APP_NAME// /-}-${VERSION_NAME}.apk"
          mv "$APK" "$FINAL"
          echo "apk_path=$FINAL" >> $GITHUB_OUTPUT
          echo "::notice::APK valid: $FINAL ($SIZE bytes)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            ${{ steps.validate.outputs.apk_path }}
            app.config.json
          if-no-files-found: error

      - name: Create GitHub Release
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.validate.outputs.apk_path }}
        run: |
          TAG="v${VERSION_NAME}-${VERSION_CODE}"
          TITLE="${APP_NAME} v${VERSION_NAME}"
          NOTES="Automated build ${VERSION_CODE} for ${PKG} (branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA})."
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK missing before release: $APK_PATH"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "::group::Release attempt $attempt for $TAG"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG exists — uploading asset (clobber)"
              if gh release upload "$TAG" "$APK_PATH" --clobber; then
                echo "::endgroup::"; echo "released=true" >> $GITHUB_OUTPUT; exit 0
              fi
            else
              if gh release create "$TAG" "$APK_PATH" \
                   --title "$TITLE" --notes "$NOTES" --target "$GITHUB_SHA"; then
                echo "::endgroup::"; echo "released=true" >> $GITHUB_OUTPUT; exit 0
              fi
            fi
            echo "::warning::Release attempt $attempt failed — retrying in $((attempt * 10))s"
            echo "::endgroup::"
            sleep $((attempt * 10))
          done
          echo "::error::Create GitHub Release failed after 3 attempts. Check that the workflow token has contents: write permission (Settings → Actions → General → Workflow permissions → Read and write)."
          exit 1

      - name: Release fallback notice
        if: steps.release.outcome == 'failure'
        run: |
          echo "::warning::GitHub Release was not created, but the APK is available as the 'apk-release' workflow artifact."

      - name: Build summary
        if: always()
        run: |
          {
            echo "### Build APK ${VERSION_NAME} (${VERSION_CODE})"
            echo ""
            echo "- App: ${APP_NAME} (${PKG})"
            echo "- APK: ${{ steps.validate.outputs.apk_path }}"
            echo "- Release: ${{ steps.release.outcome }}"
          } >> $GITHUB_STEP_SUMMARY
