name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama aplikasi'
        required: false
        default: 'MANGAKU'
      version_name:
        description: 'Version name (mis. 1.0.0)'
        required: false
        default: '1.2.26'
      version_code:
        description: 'Version code (angka)'
        required: false
        default: '149'
      website_url:
        description: 'URL website yang dibungkus WebView'
        required: false
        default: ''
      logo_url:
        description: 'URL logo website (PNG) untuk app icon'
        required: false
        default: ''
      release_tag:
        description: 'Tag GitHub Release'
        required: false
        default: 'v1.2.26-manual'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep Gradle lean on GitHub runners — no daemon, no parallel, no build cache writes
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=false
    -Dorg.gradle.workers.max=1
    -Dorg.gradle.caching=false
    -Dorg.gradle.configuration-cache=false
    -Dfile.encoding=UTF-8
  JAVA_TOOL_OPTIONS: -Xmx2g
  # Migrate JS-based actions off deprecated Node 20 runtime
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            apk-config.json
            apk-icon.b64
          sparse-checkout-cone-mode: false

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Node.js
        run: |
          node -v
          npm -v
          # Fail early if somehow still on Node 20
          MAJOR=$(node -p "process.versions.node.split('.')[0]")
          if [ "$MAJOR" -lt 22 ]; then
            echo "Expected Node.js 22+, got $(node -v)"
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Do NOT enable gradle-cache here — it races with setup-gradle and
          # produces "Failed to save cache entry" noise that can fail the job.

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          log-accepted-android-sdk-licenses: false
          accept-android-sdk-licenses: true

      - name: Generate Android project
        run: |
          set -euo pipefail
          node -v
          test -f .github/scripts/gen-android.js
          node .github/scripts/gen-android.js
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          WEBSITE_URL: ${{ github.event.inputs.website_url }}
          LOGO_URL: ${{ github.event.inputs.logo_url }}
          FALLBACK_PACKAGE: 'com.mangareader.app'

      - name: Validate project
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/values/strings.xml
          test -f app/src/main/res/values/themes.xml
          test -f app/src/main/res/values/colors.xml

          # Drop legacy/corrupt/oversized icons (AAPT2 killers)
          find app/src/main/res -name 'ic_launcher.png' -type f 2>/dev/null | while read -r p; do
            if ! head -c 4 "$p" | grep -q $'\x89PNG'; then
              echo "Corrupt PNG — removing $p"
              rm -f "$p"
            else
              SZ=$(wc -c < "$p" | tr -d ' ')
              if [ "$SZ" -gt 409600 ]; then
                echo "Oversized icon $SZ bytes — removing $p"
                rm -f "$p"
              fi
            fi
          done

          HAS_PNG=0
          HAS_XML=0
          if ls app/src/main/res/mipmap-*/ic_launcher.png >/dev/null 2>&1; then HAS_PNG=1; fi
          if [ -f app/src/main/res/drawable/ic_launcher.xml ]; then HAS_XML=1; fi

          # Only one icon family
          if [ "$HAS_PNG" -eq 1 ] && [ "$HAS_XML" -eq 1 ]; then
            rm -f app/src/main/res/drawable/ic_launcher.xml
            HAS_XML=0
          fi

          if [ "$HAS_PNG" -eq 0 ] && [ "$HAS_XML" -eq 0 ]; then
            mkdir -p app/src/main/res/drawable
            printf '%s\n' \
              '<?xml version="1.0" encoding="utf-8"?>' \
              '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">' \
              '<path android:fillColor="#E23636" android:pathData="M0,0h108v108h-108z"/>' \
              '<path android:fillColor="#FFFFFF" android:pathData="M30,30h48v48h-48z"/>' \
              '</vector>' > app/src/main/res/drawable/ic_launcher.xml
            sed -i 's|@mipmap/ic_launcher|@drawable/ic_launcher|g' app/src/main/AndroidManifest.xml
          fi
          if [ "$HAS_PNG" -eq 1 ]; then
            sed -i 's|@drawable/ic_launcher|@mipmap/ic_launcher|g' app/src/main/AndroidManifest.xml
          fi

          echo "=== app/build.gradle ==="
          cat app/build.gradle
          echo "=== Manifest icon ==="
          grep -E 'icon|roundIcon' app/src/main/AndroidManifest.xml || true
          echo "=== res tree ==="
          find app/src/main/res -type f | sort
          echo "Project OK"

      # Install Gradle via the official distribution — NO gradle/actions/setup-gradle.
      # That action's cache save step was failing with:
      #   Failed to save cache entry with path '/home/runner/.gradle/caches,...'
      # and contributed to flaky / failed jobs. We build without remote Gradle cache.
      - name: Install Gradle 8.2
        run: |
          set -euo pipefail
          GRADLE_VER=8.2
          curl -fsSL -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip"
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VER}/bin" >> "$GITHUB_PATH"
          export PATH="/opt/gradle-${GRADLE_VER}/bin:$PATH"
          gradle --version

      - name: Build release APK
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "JAVA_HOME=${JAVA_HOME:-}"
          java -version
          gradle --version || true

          if [ -n "${ANDROID_HOME:-}" ]; then
            # Escape backslashes for properties file
            SDK_ESC=$(printf '%s' "$ANDROID_HOME" | sed 's/\\/\\\\/g')
            echo "sdk.dir=${SDK_ESC}" > local.properties
          else
            echo "ANDROID_HOME empty — abort"
            exit 1
          fi
          cat local.properties

          # Always generate a fresh wrapper so we don't depend on committed jars
          gradle wrapper --gradle-version 8.2 --no-daemon
          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

          # Disable any residual build-cache / configuration-cache
          {
            echo 'org.gradle.caching=false'
            echo 'org.gradle.configuration-cache=false'
            echo 'org.gradle.daemon=false'
            echo 'org.gradle.parallel=false'
            echo 'org.gradle.workers.max=1'
            echo 'org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m'
            echo 'android.useAndroidX=true'
            echo 'android.nonTransitiveRClass=true'
          } > gradle.properties

          build_once() {
            local label="$1"
            shift
            echo "=== Gradle build: ${label} ==="
            set +e
            ./gradlew "$@" \
              --no-daemon \
              --no-parallel \
              --no-build-cache \
              --max-workers=1 \
              --stacktrace \
              2>&1 | tee "/tmp/gradle-${label}.log"
            local rc=${PIPESTATUS[0]}
            set -e
            return "$rc"
          }

          if ! build_once first assembleRelease; then
            echo '--- First build failed; extracting errors ---'
            grep -E 'FAILURE:|error:|What went wrong:|AAPT|Execution failed|Could not|Caused by:' \
              /tmp/gradle-first.log | tail -n 60 || true
            tail -n 40 /tmp/gradle-first.log || true

            echo '--- Retry: clean + vector icon + assembleRelease ---'
            ./gradlew --stop || true
            rm -rf app/build .gradle build

            # Drop PNG icons — common AAPT2 failure source
            if ls app/src/main/res/mipmap-*/ic_launcher.png >/dev/null 2>&1; then
              echo "Removing PNG icons for retry"
              rm -f app/src/main/res/mipmap-*/ic_launcher.png
              mkdir -p app/src/main/res/drawable
              printf '%s\n' \
                '<?xml version="1.0" encoding="utf-8"?>' \
                '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">' \
                '<path android:fillColor="#E23636" android:pathData="M0,0h108v108h-108z"/>' \
                '<path android:fillColor="#FFFFFF" android:pathData="M30,30h48v48h-48z"/>' \
                '</vector>' > app/src/main/res/drawable/ic_launcher.xml
              sed -i 's|@mipmap/ic_launcher|@drawable/ic_launcher|g' app/src/main/AndroidManifest.xml
            fi

            if ! build_once retry clean assembleRelease; then
              echo '--- Retry also failed ---'
              grep -E 'FAILURE:|error:|What went wrong:|AAPT|Execution failed|Could not|Caused by:' \
                /tmp/gradle-retry.log | tail -n 80 || true
              tail -n 100 /tmp/gradle-retry.log || true
              exit 1
            fi
          fi

          ls -la app/build/outputs/apk/release/ || {
            echo "Release APK missing"
            find app/build -name '*.apk' 2>/dev/null || true
            exit 1
          }
          echo "APK build OK"

      - name: Sign & package APK
        id: sign
        run: |
          set -euo pipefail
          APK=$(find . -path '*/outputs/apk/release/*.apk' ! -name '*.apk.idsig' | head -1)
          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan"
            find . -name '*.apk' 2>/dev/null || true
            exit 1
          fi
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
            SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
            "$SIGNER" sign --ks /tmp/release.jks \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              "$APK"
            echo "Signed with release keystore"
          else
            echo "KEYSTORE_BASE64 tidak diset — APK memakai debug signing (initWith debug)"
          fi
          SIGNED_APK="app-${{ github.event.inputs.version_name }}.apk"
          cp "$APK" "$SIGNED_APK"
          ls -la "$SIGNED_APK"
          echo "apk_path=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.app_name }} v${{ github.event.inputs.version_name }}
          files: ${{ steps.sign.outputs.apk_path }}
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
