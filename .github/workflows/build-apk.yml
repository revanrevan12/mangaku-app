name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama aplikasi'
        required: false
        default: 'MANGAKU'
      version_name:
        description: 'Version name (mis. 1.0.0)'
        required: false
        default: '1.2.15'
      version_code:
        description: 'Version code (angka)'
        required: false
        default: '138'
      website_url:
        description: 'URL website yang dibungkus WebView'
        required: false
        default: ''
      logo_url:
        description: 'URL logo website (PNG/JPG) untuk app icon'
        required: false
        default: ''
      release_tag:
        description: 'Tag GitHub Release'
        required: false
        default: 'v1.2.15-manual'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.caching=true -Dorg.gradle.workers.max=1 -Dfile.encoding=UTF-8
  JAVA_TOOL_OPTIONS: -Xmx3g

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            apk-config.json
            apk-icon.b64
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Generate Android project
        run: node .github/scripts/gen-android.js
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          WEBSITE_URL: ${{ github.event.inputs.website_url }}
          LOGO_URL: ${{ github.event.inputs.logo_url }}
          FALLBACK_PACKAGE: 'com.mangareader.app'

      - name: Validate project
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/values/strings.xml
          test -f app/src/main/res/values/themes.xml
          if [ -f app/src/main/res/drawable-nodpi/ic_launcher.png ]; then
            # Reject corrupted PNG (was written as UTF-8 text in older generators)
            if ! head -c 4 app/src/main/res/drawable-nodpi/ic_launcher.png | grep -q $'PNG'; then
              echo "Corrupt PNG icon — removing"
              rm -f app/src/main/res/drawable-nodpi/ic_launcher.png
            fi
          fi
          if [ ! -f app/src/main/res/drawable-nodpi/ic_launcher.png ] && [ ! -f app/src/main/res/drawable/ic_launcher.xml ]; then
            mkdir -p app/src/main/res/drawable
            printf '%s
' '<?xml version="1.0" encoding="utf-8"?>' '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">' '<path android:fillColor="#E23636" android:pathData="M0,0h108v108h-108z"/>' '<path android:fillColor="#FFFFFF" android:pathData="M30,30h48v48h-48z"/>' '</vector>' > app/src/main/res/drawable/ic_launcher.xml
          fi
          test -f app/src/main/res/drawable/ic_launcher.xml || test -f app/src/main/res/drawable-nodpi/ic_launcher.png
          echo "Project OK"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false
          cache-cleanup: on-success

      - name: Build release APK
        run: |
          set -euo pipefail
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease             --no-daemon --no-parallel --no-configuration-cache             --max-workers=1 --stacktrace 2>&1 | tee /tmp/gradle-build.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            echo '--- Retry: clean assembleRelease (no cache) ---'
            ./gradlew --stop || true
            rm -rf app/build .gradle
            ./gradlew clean assembleRelease               --no-daemon --no-parallel --no-build-cache --no-configuration-cache               --max-workers=1 --stacktrace --info
          fi
          ls -la app/build/outputs/apk/release/ || {
            echo "Release APK missing"
            find app/build -name '*.apk' 2>/dev/null || true
            tail -n 100 /tmp/gradle-build.log || true
            exit 1
          }

      - name: Sign & package APK
        id: sign
        run: |
          set -e
          APK=$(find . -path '*/outputs/apk/release/*.apk' ! -name '*.apk.idsig' | head -1)
          if [ -z "$APK" ]; then echo "APK tidak ditemukan"; find . -name '*.apk' 2>/dev/null; exit 1; fi
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
            SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
            "$SIGNER" sign --ks /tmp/release.jks \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              "$APK"
            echo "Signed with release keystore"
          else
            echo "KEYSTORE_BASE64 tidak diset — APK memakai debug signing (initWith debug)"
          fi
          SIGNED_APK="app-${{ github.event.inputs.version_name }}.apk"
          cp "$APK" "$SIGNED_APK"
          echo "apk_path=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.app_name }} v${{ github.event.inputs.version_name }}
          files: ${{ steps.sign.outputs.apk_path }}
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
