# Workflow ini membangun APK release (signed) secara otomatis di GitHub,
# lalu mempublishnya sebagai Release. Tidak perlu Android Studio.
#
# Secret yang dipakai (diset otomatis oleh dashboard admin):
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#
# Cara manual (jika belum diset secret): workflow akan generate keystore
# debug sementara agar build tetap jalan.
name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-platform-version: '34'
          sdk-build-tools-version: '34.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate signing keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS_PASS="${KS_PASS:-debugpass123}"
          KEY_ALIAS="${KEY_ALIAS:-mangaku}"
          KEY_PASS="${KEY_PASS:-debugpass123}"
          keytool -genkey -v \
            -keystore release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -dname "CN=MangaKu, OU=App, O=MangaKu, L=ID, ST=ID, C=ID"
          printf 'storePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties

      - name: Build release APK
        run: gradle assembleRelease

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: APK Build v${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
