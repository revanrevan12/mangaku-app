name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama aplikasi'
        required: false
        default: 'MANGAKU'
      version_name:
        description: 'Version name (mis. 1.0.0)'
        required: false
        default: '1.2.7'
      version_code:
        description: 'Version code (angka)'
        required: false
        default: '130'
      website_url:
        description: 'URL website yang dibungkus WebView'
        required: false
        default: ''
      logo_url:
        description: 'URL logo website (PNG/JPG) untuk app icon'
        required: false
        default: ''
      release_tag:
        description: 'Tag GitHub Release'
        required: false
        default: 'v1.2.7-manual'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dkotlin.incremental=false -Dorg.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
            apk-config.json
            apk-icon.b64
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Generate Android project
        run: node .github/scripts/gen-android.js
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          WEBSITE_URL: ${{ github.event.inputs.website_url }}
          LOGO_URL: ${{ github.event.inputs.logo_url }}
          FALLBACK_PACKAGE: 'com.mangareader.app'

      - name: Validate project
        run: |
          set -e
          test -f settings.gradle && test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/values/strings.xml
          test -f app/src/main/res/drawable/ic_launcher.xml || test -f app/src/main/res/drawable-nodpi/ic_launcher.png
          echo "OK"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false
          cache-cleanup: on-success

      - name: Build release APK
        run: |
          set -euo pipefail
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7 --no-daemon
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --build-cache --parallel -q
          ls -la app/build/outputs/apk/release/

      - name: Sign & package APK
        id: sign
        run: |
          set -e
          APK=$(find . -path '*/outputs/apk/release/*.apk' ! -name '*.apk.idsig' | head -1)
          if [ -z "$APK" ]; then echo "APK tidak ditemukan"; find . -name '*.apk' 2>/dev/null; exit 1; fi
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
            SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
            "$SIGNER" sign --ks /tmp/release.jks \
              --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              "$APK"
            echo "Signed with release keystore"
          else
            echo "KEYSTORE_BASE64 tidak diset — APK memakai debug signing"
          fi
          SIGNED_APK="app-${{ github.event.inputs.version_name }}.apk"
          cp "$APK" "$SIGNED_APK"
          echo "apk_path=$SIGNED_APK" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.app_name }} v${{ github.event.inputs.version_name }}
          files: ${{ steps.sign.outputs.apk_path }}
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
