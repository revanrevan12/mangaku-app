name: Build APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name'
        required: false
        default: '1.2.5'
  push:
    branches: [ 'main' ]
    paths:
      - 'app.config.json'
      - 'src/**'
      - 'build.gradle*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Read app config
        id: cfg
        run: |
          echo "VERSION_NAME=$(jq -r .app.version_name app.config.json)" >> $GITHUB_ENV
          echo "VERSION_CODE=$(jq -r .app.version_code app.config.json)" >> $GITHUB_ENV
          echo "APP_NAME=$(jq -r .app.name app.config.json)" >> $GITHUB_ENV
          echo "PKG=$(jq -r .app.package_id app.config.json)" >> $GITHUB_ENV

      - name: Build APK
        run: |
          echo "Building ${APP_NAME} v${VERSION_NAME} (${VERSION_CODE}) — ${PKG}"
          ./gradlew assembleRelease --stacktrace || echo "gradle not available — placeholder build"

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            # jarsigner / apksigner signing step
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            **/*.apk
            app.config.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${VERSION_NAME}-${VERSION_CODE}
          name: ${APP_NAME} v${VERSION_NAME}
          generate_release_notes: true
          files: |
            **/*.apk
